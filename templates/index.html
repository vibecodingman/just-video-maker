        * {

        body {

        header {

        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            padding-left: 50px;
            background: #1f2231;
            border: 2px solid transparent;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-pink));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(254, 9, 121, 0.3);
        }

        .alert-error {
            display: none;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            background: rgba(254, 9, 121, 0.1);
            border: 1px solid var(--accent-pink);
            color: #ff4a9a;
            align-items: center;

<body>

    <div class="container">
        <header>
            <h1>Vibe Downloader</h1>
            <p>Скачивай медиа из TikTok (без водяного знака) и YouTube в один клик</p>
        </header>

        <main class="main-card">
            <div class="alert-error" id="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text"></span>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-link"></i>
                <input type="url" id="video-url-input" placeholder="Вставьте ссылку на TikTok или YouTube..." required autocomplete="off">
            </div>
            
            <button type="button" onclick="startDownload()" class="btn-submit" id="submit-btn">
                <span><i class="fa-solid fa-wand-magic-sparkles"></i> Скачать контент</span>
            </button>
        </main>
    </div>

    <script>
        function startDownload() {
            const url = document.getElementById('video-url-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            if (errorMsg) errorMsg.style.display = 'none';

            if (!url) {
                if (errorText && errorMsg) {
                    errorText.innerText = "Пожалуйста, вставьте ссылку.";
                    errorMsg.style.display = 'flex';
                }
                return;
            }

            if (!url.includes('tiktok.com') && !url.includes('youtube.com') && !url.includes('youtu.be') && !url.includes('shorts')) {
                if (errorText && errorMsg) {
                    errorText.innerText = "Пожалуйста, введите корректную ссылку на TikTok или YouTube.";
                    errorMsg.style.display = 'flex';
                }
                return;
            }

            // Формируем ссылку на get-save.com
            const redirectUrl = "https://get-save.com" + encodeURIComponent(url);

            // Перенаправляем пользователя прямо в текущей вкладке (обороняет от блокировок браузеров)
            window.location.href = redirectUrl;
        }
    </script>
