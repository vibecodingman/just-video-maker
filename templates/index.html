    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --accent-neon: #00f2fe;
            --accent-pink: #fe0979;
            --text-color: #ffffff;
            --text-muted: #8a8f9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;

        header h1 {

        header p {

            font-size: 0.95rem;
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            padding-left: 50px;
            background: #1f2231;
            border: 2px solid transparent;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-pink));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(254, 9, 121, 0.3);
        }

        .result-box {
            display: none;
            margin-top: 25px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .btn-success {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #00ff87;
            color: #000;
            padding: 16px 30px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0, 255, 135, 0.2);
            transition: all 0.2s;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 255, 135, 0.4);
        }

        .alert-error {
            display: none;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            background: rgba(254, 9, 121, 0.1);
            border: 1px solid var(--accent-pink);
            color: #ff4a9a;
        }

        .loader-spinner {
            display: none;
            margin: 20px auto;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

<body>

    <div class="container">
        <header>
            <h1>Vibe Downloader</h1>
            <p>Скачивай медиа из TikTok (без водяного знака) и YouTube в один клик</p>
        </header>

        <main class="main-card">
            <div class="alert-error" id="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text"></span>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-link"></i>
                <input type="url" id="video-url-input" placeholder="Вставьте ссылку на TikTok или YouTube..." required autocomplete="off">
            </div>
            
            <button type="button" onclick="startDownload()" class="btn-submit" id="submit-btn">
                <span id="btn-label"><i class="fa-solid fa-wand-magic-sparkles"></i> Скачать контент</span>
            </button>

            <div class="loader-spinner" id="loading-spinner"></div>

            <div class="result-box" id="result-container">
                <h3>🎉 Файл успешно обработан!</h3>
                <a href="#" id="download-link-btn" target="_blank" rel="noopener noreferrer" class="btn-success">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Открыть и сохранить видео
                </a>
            </div>
        </main>
    </div>

    <script>
        async function startDownload() {
            const url = document.getElementById('video-url-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const resultContainer = document.getElementById('result-container');
            const spinner = document.getElementById('loading-spinner');
            const downloadBtn = document.getElementById('download-link-btn');

            errorMsg.style.display = 'none';
            resultContainer.style.display = 'none';

            if (!url) {
                errorText.innerText = "Пожалуйста, вставьте ссылку.";
                errorMsg.style.display = 'flex';
                return;
            }

            if (!url.includes('tiktok.com') && !url.includes('youtube.com') && !url.includes('youtu.be') && !url.includes('shorts')) {
                errorText.innerText = "Пожалуйста, введите корректную ссылку на TikTok или YouTube.";
                errorMsg.style.display = 'flex';
                return;
            }

            // Включаем лоадер
            spinner.style.display = 'block';

            try {
                // Прямой анонимный веб-запрос к независимому азиатскому шлюзу обхода блокировок
                const response = await fetch(`https://vreden.my.id{encodeURIComponent(url)}`);
                const data = await response.json();

                spinner.style.display = 'none';

                if (data && data.status === true) {
                    const res = data.result;
                    // Автоматически определяем нужную ссылку для скачивания (YouTube или TikTok)
                    const finalDownloadUrl = res.url || res.nowatermark || res.video;
                    
                    if (finalDownloadUrl) {
                        downloadBtn.href = finalDownloadUrl;
                        resultContainer.style.display = 'block';
                    } else {
                        throw new Error();
                    }
                } else {
                    throw new Error();
                }
            } catch (err) {
                spinner.style.display = 'none';
                errorText.innerText = "Не удалось извлечь видео напрямую. Попробуйте еще раз через минуту или другую ссылку.";
                errorMsg.style.display = 'flex';
            }
        }
    </script>
