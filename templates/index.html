<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="171fb765a1e95de0dbb537cf37e276505e3257d8" content="171fb765a1e95de0dbb537cf37e276505e3257d8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать Видео из TikTok без водяного знака — Бесплатно</title>
    <!-- Подключаем стильный шрифт и иконки -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --accent-neon: #00f2fe;
            --accent-pink: #fe0979;
            --text-color: #ffffff;
            --text-muted: #8a8f9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            padding-left: 50px;
            background: #1f2231;
            border: 2px solid transparent;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-pink));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(254, 9, 121, 0.3);
        }

        /* Анимация загрузки (Spinner) */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Ошибки и Успех */
        .alert {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-error {
            background: rgba(254, 9, 121, 0.1);
            border: 1px solid var(--accent-pink);
            color: #ff4a9a;
        }

        .success-box {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .btn-success {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #00ff87;
            color: #000;
            padding: 16px 30px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0, 255, 135, 0.2);
            transition: all 0.2s;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 255, 135, 0.4);
        }

        /* Рекламные Слоты */
        .ads-slot {
            width: 100%;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- РЕКЛАМНЫЙ БЛОК РСЯ №1 (Над формой) -->
        <div class="ads-slot">
            <!-- Сюда вставляется код РСЯ (Например, адаптивный баннер) -->
            Реклама
        </div>

        <header>
            <h1>TikTok Save Vibe</h1>
            <p>Скачивай видеоролики без логотипов и водяных знаков в пару кликов</p>
        </header>

        <main class="main-card">
            
            {% if error %}
                <div class="alert alert-error">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
                </div>
            {% endif %}

            {% if video_url %}
                <div class="success-box">
                    <h3 style="margin-bottom: 10px;">🎉 Ссылка успешно сгенерирована!</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Нажмите кнопку ниже, чтобы открыть и сохранить видео:</p>
                    <a href="{{ video_url }}" target="_blank" download="tiktok_video.mp4" class="btn-success">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Скачать MP4 файл
                    </a>
                </div>
            {% else %}
                <form action="/download" method="POST" onsubmit="showLoading()">
                    <div class="input-group">
                        <i class="fa-brands fa-tiktok"></i>
                        <input type="url" name="url" placeholder="Вставьте ссылку на TikTok видео..." required autocomplete="off">
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submit-btn">
                        <span class="btn-text"><i class="fa-solid fa-wand-magic-sparkles"></i> Получить видео</span>
                        <div class="spinner" id="btn-spinner"></div>
                    </button>
                </form>
            {% endif %}

        </main>

        <!-- РЕКЛАМНЫЙ БЛОК РСЯ №2 (Под основной картой) -->
        <div class="ads-slot">
            <!-- Сюда вставляется код РСЯ (Например, блок директа/InPage) -->
            Реклама
        </div>

        <!-- РЕКЛАМНЫЙ БЛОК РСЯ №3 (В самом низу) -->
        <div class="ads-slot" style="margin-top: auto; min-height: 150px;">
            <!-- Сюда вставляется код РСЯ (Большой горизонтальный баннер) -->
            Реклама
        </div>

    </div>

    <script>
        function showLoading() {
            const btnText = document.querySelector('.btn-text');
            const spinner = document.getElementById('btn-spinner');
            const btn = document.getElementById('submit-btn');
            
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.8';
        }
    </script>
</body>
</html>
